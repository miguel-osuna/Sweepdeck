name: Homebrew release-candidate smoke
on:
  pull_request:
    paths:
      - ".github/workflows/homebrew-candidate.yml"
      - ".github/workflows/release.yml"
      - "scripts/build-app.sh"
      - "scripts/package-dmg.sh"
      - "scripts/test-dmg-candidate.sh"
      - "scripts/test-homebrew-candidate.sh"
permissions:
  contents: read
jobs:
  macos:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a disposable Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Build the first-release-format archive
        env:
          SWEEPDECK_VERSION: 0.1.0
          SWEEPDECK_BUILD_STAGE: ${{ runner.temp }}/SweepdeckBuild-stage
        run: bash scripts/build-app.sh
      - name: Package the direct-download DMG
        run: bash scripts/package-dmg.sh 0.1.0 dist/Sweepdeck-0.1.0-macOS.zip
      - name: Inspect the versioned DMG on the disposable runner
        env:
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' && runner.arch == 'ARM64' }}
        run: bash scripts/test-dmg-candidate.sh 0.1.0 dist/Sweepdeck-0.1.0-macOS.dmg
      - name: Validate Homebrew install and report first-launch approval behavior
        env:
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' && runner.arch == 'ARM64' }}
        run: bash scripts/test-homebrew-candidate.sh 0.1.0 dist/Sweepdeck-0.1.0-macOS.zip
      - name: Preserve disposable first-launch screen for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweepdeck-first-launch-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Sweepdeck-first-launch-${{ github.run_id }}-${{ github.run_attempt }}-*.png
          if-no-files-found: ignore
          retention-days: 1
