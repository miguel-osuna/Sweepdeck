name: Build and test
on: [push, pull_request, workflow_dispatch, workflow_call]
permissions:
  contents: read
jobs:
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Report release-tooling audit findings
        shell: bash
        run: |
          set -euo pipefail
          audit_file="$RUNNER_TEMP/sweepdeck-npm-audit.json"
          npm audit --json > "$audit_file" || true
          AUDIT_JSON="$audit_file" node - <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.AUDIT_JSON, "utf8"));
          if (!report.metadata?.vulnerabilities) throw new Error("npm audit returned no vulnerability metadata");
          console.log("npm audit severity counts:", JSON.stringify(report.metadata.vulnerabilities));
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            const advisories = (finding.via ?? [])
              .filter((item) => typeof item === "object")
              .map((item) => `${item.source ?? "unknown"} ${item.title ?? ""}`.trim());
            console.log(`${finding.severity} ${name} ${finding.range}; direct=${finding.isDirect}; fix=${JSON.stringify(finding.fixAvailable)}; ${advisories.join("; ")}`);
          }
          NODE
      - run: npm run test:release-tools

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release version metadata
        run: bash scripts/test-app-version.sh
      - name: Test Sparkle updater defaults
        run: bash scripts/test-updater-config.sh
      - name: Test coverage gate
        run: python3 scripts/test-core-coverage.py
      - name: Test Swift build cache relocation
        run: bash scripts/test-swift-build-cache.sh
      - name: Select installed Swift 6.2 Xcode
        shell: bash
        run: |
          for app in /Applications/Xcode*.app; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if xcrun swift --version | grep -q 'Swift version 6.2'; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No Swift 6.2 Xcode is installed on this runner.' >&2
          exit 1
      - run: bash scripts/swift.sh test --enable-code-coverage
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
      - name: Report macOS test crash stacks
        if: failure()
        run: python3 scripts/report-macos-test-crashes.py
      - name: Enforce SweepdeckCore line coverage floor
        run: |
          coverage_json="$(find .build -path '*/codecov/Sweepdeck.json' -type f -print -quit)"
          test -n "$coverage_json"
          python3 scripts/check_core_coverage.py "$coverage_json" 80
      - run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweepdeck-local-build
          path: dist/Sweepdeck-macOS.zip
          if-no-files-found: error

  sparkle_local_update:
    name: Sparkle localhost update on a disposable runner
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a disposable Apple Silicon runner
        env:
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' && runner.arch == 'ARM64' }}
        run: |
          [[ "${GITHUB_ACTIONS:-}" == true && "$SWEEPDECK_DISPOSABLE_RUNNER" == true ]] || {
            echo "The localhost update test must run on a disposable GitHub-hosted Apple Silicon runner." >&2
            exit 1
          }
      - name: Select installed Swift 6.2 Xcode
        shell: bash
        run: |
          for app in /Applications/Xcode*.app; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if xcrun swift --version | grep -q 'Swift version 6.2'; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No Swift 6.2 Xcode is installed on this runner.' >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare pinned Sparkle tools
        run: bash scripts/prepare-sparkle.sh
      - name: Create an ephemeral localhost test signing key
        shell: bash
        run: |
          set -euo pipefail
          private_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$private_key"
          public_key="$(SPARKLE_EDDSA_PRIVATE_KEY="$private_key" node scripts/verify-sparkle-key.mjs --print-public)"
          {
            printf 'SPARKLE_EDDSA_PRIVATE_KEY=%s\n' "$private_key"
            printf 'SPARKLE_EDDSA_PUBLIC_KEY=%s\n' "$public_key"
          } >> "$GITHUB_ENV"
          unset private_key public_key
      - name: Verify an isolated signed install-on-quit update
        run: bash scripts/test-local-updates.sh automatic
      - name: Audit Sparkle installation with quarantine on the old test bundle
        run: bash scripts/test-local-updates.sh quarantined

  latest-swift:
    name: Latest stable Swift 6.4.1 on macOS 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test release version metadata
        run: bash scripts/test-app-version.sh
      - name: Test Sparkle updater defaults
        run: bash scripts/test-updater-config.sh
      - name: Test coverage gate
        run: python3 scripts/test-core-coverage.py
      - name: Test Swift build cache relocation
        run: bash scripts/test-swift-build-cache.sh
      - name: Install Swift 6.4.1 toolchain
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/swift-6.4.1-RELEASE-osx.pkg"
          toolchain="$HOME/Library/Developer/Toolchains/swift-6.4.1-RELEASE.xctoolchain"
          curl -fL --retry 3 --output "$package" "https://download.swift.org/swift-6.4.1-release/xcode/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-osx.pkg"
          pkgutil --check-signature "$package" | grep -Fq 'Developer ID Installer: Swift Open Source (V9AUD2URP3)'
          installer -pkg "$package" -target CurrentUserHomeDirectory
          test -d "$toolchain"
          toolchain_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$toolchain/Info.plist")"
          echo "TOOLCHAINS=$toolchain_id" >> "$GITHUB_ENV"
          echo "$toolchain/usr/bin" >> "$GITHUB_PATH"
          "$toolchain/usr/bin/swift" --version
      - run: bash scripts/swift.sh test --enable-code-coverage
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
      - name: Report macOS test crash stacks
        if: failure()
        run: python3 scripts/report-macos-test-crashes.py
      - name: Enforce SweepdeckCore line coverage floor
        run: |
          coverage_json="$(find .build -path '*/codecov/Sweepdeck.json' -type f -print -quit)"
          test -n "$coverage_json"
          python3 scripts/check_core_coverage.py "$coverage_json" 80
      - run: bash scripts/build-app.sh

  latest-macos:
    name: macOS 27 / Xcode 27 preview
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report platform toolchain
        run: sw_vers && xcodebuild -version && swift --version
      - name: Test release version metadata
        run: bash scripts/test-app-version.sh
      - name: Test Sparkle updater defaults
        run: bash scripts/test-updater-config.sh
      - name: Test coverage gate
        run: python3 scripts/test-core-coverage.py
      - name: Test Swift build cache relocation
        run: bash scripts/test-swift-build-cache.sh
      - run: bash scripts/swift.sh test --enable-code-coverage
        env:
          SWIFT_BACKTRACE: enable=yes,interactive=no
      - name: Report macOS test crash stacks
        if: failure()
        run: python3 scripts/report-macos-test-crashes.py
      - name: Enforce SweepdeckCore line coverage floor
        run: |
          coverage_json="$(find .build -path '*/codecov/Sweepdeck.json' -type f -print -quit)"
          test -n "$coverage_json"
          python3 scripts/check_core_coverage.py "$coverage_json" 80
      - run: bash scripts/build-app.sh
