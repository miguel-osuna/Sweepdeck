name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Calculate a release and continue to the protected publish step"
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: sweepdeck-release
  cancel-in-progress: false

jobs:
  gate:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require main and explicit readiness
        env:
          RELEASE_READY: ${{ vars.RELEASE_READY }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || {
            echo "Releases can only run from main." >&2
            exit 1
          }
          [[ "$RELEASE_READY" == "true" ]] || {
            echo "Set the RELEASE_READY repository variable only after release checks are complete." >&2
            exit 1
          }
      - name: Require a reviewer-protected release environment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/check-release-environment.sh

  verify:
    needs: gate
    if: inputs.publish == true
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  candidate:
    needs: [gate, verify]
    if: inputs.publish == true
    runs-on: macos-15
    permissions:
      contents: write
    outputs:
      release_version: ${{ steps.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select installed Swift 6.2 Xcode
        shell: bash
        run: |
          for app in /Applications/Xcode*.app; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if xcrun swift --version | grep -q 'Swift version 6.2'; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No Swift 6.2 Xcode is installed on this runner.' >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Create first-release baseline when needed
        run: bash scripts/ensure-release-baseline.sh
      - name: Calculate and validate the candidate version
        id: preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/semantic-release-dry-run.log"
          npm run release:dry-run 2>&1 | tee "$log"
          version="$(sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$log" | tail -n 1)"
          if [[ -z "$version" ]]; then
            if grep -Fq "There are no relevant changes, so no new version is released" "$log"; then
              echo "version=" >> "$GITHUB_OUTPUT"
              echo "No Conventional Commit requires a release."
              exit 0
            fi
            echo "Could not determine the next release version from semantic-release." >&2
            exit 1
          fi
          bash scripts/validate-release-version.sh "$version"
          other_release_tags="$(git tag --list 'v[0-9]*' | grep -Ev '^v0\.0\.0$' || true)"
          if [[ -z "$other_release_tags" && "$version" != "0.1.0" ]]; then
            echo "The first public release must be 0.1.0; semantic-release proposed $version." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build a versioned release candidate
        if: steps.preflight.outputs.version != ''
        env:
          SWEEPDECK_VERSION: ${{ steps.preflight.outputs.version }}
          SWEEPDECK_BUILD_STAGE: ${{ runner.temp }}/SweepdeckBuild-stage
        run: bash scripts/build-app.sh
      - name: Package the direct-download DMG
        if: steps.preflight.outputs.version != ''
        env:
          SWEEPDECK_VERSION: ${{ steps.preflight.outputs.version }}
        run: bash scripts/package-dmg.sh "$SWEEPDECK_VERSION" "dist/Sweepdeck-${SWEEPDECK_VERSION}-macOS.zip"
      - name: Keep the candidate available for manual QA
        if: steps.preflight.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweepdeck-release-candidate-${{ steps.preflight.outputs.version }}
          path: |
            dist/Sweepdeck-${{ steps.preflight.outputs.version }}-macOS.zip
            dist/Sweepdeck-${{ steps.preflight.outputs.version }}-macOS.zip.sha256
            dist/Sweepdeck-${{ steps.preflight.outputs.version }}-macOS.dmg
            dist/Sweepdeck-${{ steps.preflight.outputs.version }}-macOS.dmg.sha256
          if-no-files-found: error
          retention-days: 7

  homebrew_candidate:
    needs: [candidate]
    if: needs.candidate.outputs.release_version != ''
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sweepdeck-release-candidate-${{ needs.candidate.outputs.release_version }}
          path: dist
      - name: Inspect the versioned DMG on the disposable runner
        env:
          SWEEPDECK_VERSION: ${{ needs.candidate.outputs.release_version }}
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' && runner.arch == 'ARM64' }}
        run: bash scripts/test-dmg-candidate.sh "$SWEEPDECK_VERSION" "dist/Sweepdeck-${SWEEPDECK_VERSION}-macOS.dmg"
      - name: Validate Homebrew install and report first-launch approval behavior
        env:
          SWEEPDECK_VERSION: ${{ needs.candidate.outputs.release_version }}
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' && runner.arch == 'ARM64' }}
        run: bash scripts/test-homebrew-candidate.sh "$SWEEPDECK_VERSION" "dist/Sweepdeck-${SWEEPDECK_VERSION}-macOS.zip"
      - name: Preserve disposable first-launch screen for review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Sweepdeck-first-launch-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/Sweepdeck-first-launch-${{ github.run_id }}-${{ github.run_attempt }}-*.png
          if-no-files-found: ignore
          retention-days: 1

  sparkle_candidate:
    needs: [candidate]
    if: needs.candidate.outputs.release_version != ''
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the exact release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sweepdeck-release-candidate-${{ needs.candidate.outputs.release_version }}
          path: dist
      - name: Extract and verify the candidate update bundle
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.release_version }}
        run: |
          set -euo pipefail
          candidate_dir="$RUNNER_TEMP/Sweepdeck-update-candidate"
          mkdir -p "$candidate_dir"
          ditto -x -k "dist/Sweepdeck-${RELEASE_VERSION}-macOS.zip" "$candidate_dir"
          candidate_app="$candidate_dir/Sweepdeck.app"
          candidate_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$candidate_app/Contents/Info.plist")"
          [[ "$candidate_version" == "$RELEASE_VERSION" ]] || {
            echo "Candidate bundle version $candidate_version does not match $RELEASE_VERSION." >&2
            exit 1
          }
          printf 'SWEEPDECK_TEST_UPDATE_APP=%s\n' "$candidate_app" >> "$GITHUB_ENV"
          printf 'SWEEPDECK_TEST_UPDATE_VERSION=%s\n' "$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Select installed Swift 6.2 Xcode
        shell: bash
        run: |
          for app in /Applications/Xcode*.app; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if xcrun swift --version | grep -q 'Swift version 6.2'; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No Swift 6.2 Xcode is installed on this runner.' >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare pinned Sparkle tools
        run: bash scripts/prepare-sparkle.sh
      - name: Create an ephemeral localhost test signing key
        shell: bash
        run: |
          set -euo pipefail
          private_key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$private_key"
          public_key="$(SPARKLE_EDDSA_PRIVATE_KEY="$private_key" node scripts/verify-sparkle-key.mjs --print-public)"
          {
            printf 'SPARKLE_EDDSA_PRIVATE_KEY=%s\n' "$private_key"
            printf 'SPARKLE_EDDSA_PUBLIC_KEY=%s\n' "$public_key"
          } >> "$GITHUB_ENV"
          unset private_key public_key
      - name: Verify install-on-quit for the exact candidate through localhost Sparkle feed
        run: bash scripts/test-local-updates.sh automatic

  publish:
    needs: [candidate, homebrew_candidate, sparkle_candidate]
    if: needs.candidate.outputs.release_version != ''
    runs-on: macos-15
    environment: release
    permissions:
      contents: write
    outputs:
      appcast_sha256: ${{ steps.signed_appcast.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download the tested release candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Sweepdeck-release-candidate-${{ needs.candidate.outputs.release_version }}
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare pinned Sparkle release tools
        run: bash scripts/prepare-sparkle.sh
      - name: Verify the release signing key matches the embedded public key
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          SPARKLE_EDDSA_PUBLIC_KEY="$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' Resources/Info.plist)" \
            node scripts/verify-sparkle-key.mjs
      - name: Generate and verify the signed Sparkle appcast before publishing
        id: signed_appcast
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.release_version }}
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          updates_dir="$RUNNER_TEMP/Sweepdeck-updates"
          mkdir -p "$updates_dir"
          cp "dist/Sweepdeck-${RELEASE_VERSION}-macOS.zip" "$updates_dir/"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            .build/dependencies/sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${RELEASE_VERSION}/" \
              --full-release-notes-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${RELEASE_VERSION}" \
              "$updates_dir"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            .build/dependencies/sparkle/bin/sign_update \
              --ed-key-file - --verify "$updates_dir/appcast.xml"
          archive_signature="$(python3 - "$updates_dir/appcast.xml" "$RELEASE_VERSION" "$GITHUB_REPOSITORY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          feed_path, version, repository = sys.argv[1:]
          root = ET.parse(feed_path).getroot()
          enclosure = root.find("./channel/item/enclosure")
          if enclosure is None:
              raise SystemExit("The signed appcast has no update archive enclosure.")
          expected_name = f"Sweepdeck-{version}-macOS.zip"
          if not enclosure.attrib.get("url", "").endswith(expected_name):
              raise SystemExit("The appcast does not point to the tested release archive.")
          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          release_notes = root.find(f"./channel/item/{{{sparkle}}}fullReleaseNotesLink")
          expected_notes = f"https://github.com/{repository}/releases/tag/v{version}"
          if release_notes is None or release_notes.text != expected_notes:
              raise SystemExit("The appcast does not link to the matching GitHub release notes.")
          signature = enclosure.attrib.get("{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature")
          if not signature:
              raise SystemExit("The release archive has no Sparkle EdDSA signature.")
          print(signature)
          PY
          )"
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | \
            .build/dependencies/sparkle/bin/sign_update \
              --ed-key-file - --verify "$updates_dir/Sweepdeck-${RELEASE_VERSION}-macOS.zip" "$archive_signature"
          printf 'sha256=%s\n' "$(shasum -a 256 "$updates_dir/appcast.xml" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Publish the reviewed version and release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
      - name: Verify and attach the tested release assets and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.candidate.outputs.release_version }}
        run: |
          set -euo pipefail
          zip="dist/Sweepdeck-${RELEASE_VERSION}-macOS.zip"
          dmg="dist/Sweepdeck-${RELEASE_VERSION}-macOS.dmg"
          (cd dist && shasum -a 256 --check "$(basename "$zip").sha256")
          (cd dist && shasum -a 256 --check "$(basename "$dmg").sha256")
          release_endpoint="repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}"
          for asset in \
            "$zip" \
            "$zip.sha256" \
            "$dmg" \
            "$dmg.sha256"; do
            asset_name="$(basename "$asset")"
            expected_digest="sha256:$(shasum -a 256 "$asset" | awk '{print $1}')"
            remote_digest="$(gh api "$release_endpoint" --jq ".assets[]? | select(.name == \"${asset_name}\") | .digest // empty")"
            if [[ -z "$remote_digest" ]]; then
              gh release upload "v${RELEASE_VERSION}" "$asset" --repo "$GITHUB_REPOSITORY"
              remote_digest="$(gh api "$release_endpoint" --jq ".assets[]? | select(.name == \"${asset_name}\") | .digest // empty")"
            fi
            [[ "$remote_digest" == "$expected_digest" ]] || {
              echo "Release asset $asset_name is missing or does not match the verified candidate." >&2
              exit 1
            }
          done
      - name: Stage the signed appcast for GitHub Pages
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/Sweepdeck-pages"
          cp "$RUNNER_TEMP/Sweepdeck-updates/appcast.xml" "$RUNNER_TEMP/Sweepdeck-pages/appcast.xml"
      - name: Upload the signed appcast Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v5.0.0
        with:
          path: ${{ runner.temp }}/Sweepdeck-pages

  deploy_appcast:
    needs: [candidate, publish]
    if: needs.candidate.outputs.release_version != '' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the signed Sparkle appcast
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v5.0.1
      - name: Verify the public appcast matches the signed artifact
        env:
          EXPECTED_SHA256: ${{ needs.publish.outputs.appcast_sha256 }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl --fail --location --silent \
              https://miguel-osuna.github.io/Sweepdeck/appcast.xml \
              --output "$RUNNER_TEMP/published-appcast.xml"; then
              actual_sha256="$(sha256sum "$RUNNER_TEMP/published-appcast.xml" | awk '{print $1}')"
              [[ "$actual_sha256" == "$EXPECTED_SHA256" ]] && exit 0
            fi
            sleep 5
          done
          echo "The published Pages appcast did not match the signed artifact after retries." >&2
          exit 1

  published_sparkle_smoke:
    needs: [candidate, deploy_appcast]
    if: needs.candidate.outputs.release_version != '' && needs.deploy_appcast.result == 'success'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select installed Swift 6.2 Xcode
        shell: bash
        run: |
          for app in /Applications/Xcode*.app; do
            export DEVELOPER_DIR="$app/Contents/Developer"
            if xcrun swift --version | grep -q 'Swift version 6.2'; then
              echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo 'No Swift 6.2 Xcode is installed on this runner.' >&2
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Prepare pinned Sparkle tools
        run: bash scripts/prepare-sparkle.sh
      - name: Install from the published HTTPS appcast on a disposable runner
        env:
          SWEEPDECK_DISPOSABLE_RUNNER: ${{ runner.environment == 'github-hosted' }}
          SWEEPDECK_TEST_UPDATE_VERSION: ${{ needs.candidate.outputs.release_version }}
          SWEEPDECK_TEST_FEED_URL: https://miguel-osuna.github.io/Sweepdeck/appcast.xml
        run: bash scripts/test-local-updates.sh published
